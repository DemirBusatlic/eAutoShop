services:
  eautoshop-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eautoshop-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1401:1433"
    expose:
      - "1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ./eAutoShop.DB:/docker-entrypoint-initdb.d:ro
    command:
      - /bin/bash
      - -c
      - |
          /opt/mssql/bin/sqlservr &
          sql_pid=$$!

          until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do
            if ! kill -0 "$$sql_pid" 2>/dev/null; then
              echo "SQL Server stopped before becoming ready."
              wait "$$sql_pid"
              exit 1
            fi

            echo "Waiting for SQL Server..."
            sleep 2
          done

          echo "SQL Server is ready."

          if [ ! -f /var/opt/mssql/data/190081.mdf ]; then
            found_sql=false

            for f in /docker-entrypoint-initdb.d/*.sql; do
              if [ ! -e "$$f" ]; then
                continue
              fi

              found_sql=true
              echo "Processing $$f"

              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "$$f" || {
                echo "Failed to process $$f"
                kill "$$sql_pid" 2>/dev/null || true
                wait "$$sql_pid" || true
                exit 1
              }
            done

            if [ "$$found_sql" != "true" ]; then
              echo "No SQL files found in /docker-entrypoint-initdb.d"
              kill "$$sql_pid" 2>/dev/null || true
              wait "$$sql_pid" || true
              exit 1
            fi

            echo "Database initialization completed successfully."
          else
            echo "Database 190081 already exists. Initialization skipped."
          fi

          touch /tmp/eautoshop-db-ready
          wait "$$sql_pid"
    networks:
      - autoshopnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/eautoshop-db-ready && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d 190081 -Q \"IF OBJECT_ID(N'dbo.Orders', N'U') IS NULL THROW 50000, 'Database schema not ready', 1; SELECT 1\" >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit loopback_users "none"'
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - autoshopnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eautoshop-api:
    container_name: eautoshop-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: eAutoShop.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=eautoshop-sql,1433;Database=190081;User Id=sa;Password=${MSSQL_SA_PASSWORD};ConnectRetryCount=10;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5236"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      REPORTS_PATH: "/app/reports"
    ports:
      - "5236:5236"
    networks:
      - autoshopnet
    depends_on:
      eautoshop-sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./eAutoShop.Api/RecommenderModels:/app/RecommenderModels
      - ./eAutoShop.Worker/Reports:/app/reports

  eautoshop-worker:
    container_name: eautoshop-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: eAutoShop.Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=eautoshop-sql,1433;Database=190081;User Id=sa;Password=${MSSQL_SA_PASSWORD};ConnectRetryCount=10;TrustServerCertificate=True"
      DOTNET_ENVIRONMENT: "Development"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      REPORTS_PATH: "/app/reports"
    networks:
      - autoshopnet
    depends_on:
      eautoshop-sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./eAutoShop.Worker/Reports:/app/reports

volumes:
  sql-data:
  rabbitmq-data:

networks:
  autoshopnet:
    driver: bridge
